[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "careercast"
version = "1.0.0"
description = "CareerCast - AI-powered career prediction and career recommendation system"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "flask",
    "pandas",
    "scikit-learn",
    "xgboost",
    "pypdf",
    "joblib",
    "python-docx",
    "fastapi",
    "uvicorn",
    "streamlit"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx"
]

[project.scripts]
careercast-api = "fastapi_service.main:app"

[tool.setuptools.packages.find]
include = ["fastapi_service*"]